# 由 scripts/gen-apps.ts 从 apps/apps.json 生成 —— 不要手改，改清单后重新生成。
# deploy.sh 会把本文件复制到 /etc/nginx/snippets/hy-wu-apps.conf（demo.conf include 它）。

# hpc_stat（project）
location /hpc_stat/ {
    alias /var/www/apps/hpc_stat/;
    try_files $uri $uri/ $uri/index.html =404;
}

