server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/demo;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态站：只给 GET/HEAD，其它方法一律 405
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
}
